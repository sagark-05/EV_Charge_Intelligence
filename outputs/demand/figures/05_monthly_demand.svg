  <g id="text_36">
   <text style="fill: #262626; font: 9px 'Arial', 'DejaVu Sans', 'Liberation Sans', 'Bitstream Vera Sans', sans-serif" transform="translate(64.402187 323.116641)">Hatching/* means a shorter represented calendar range, not missing energy data.</text>
   <text style="fill: #262626; font: 9px 'Arial', 'DejaVu Sans', 'Liberation Sans', 'Bitstream Vera Sans', sans-serif" transform="translate(64.402187 335.24625)">Even full calendar months do not verify collection uptime; boundary days may be partly observed.</text>
  </g>
 </g>
